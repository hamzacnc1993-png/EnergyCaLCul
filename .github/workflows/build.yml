name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-pip \
            python3-setuptools \
            python3-virtualenv \
            unzip \
            zip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            ant \
            libltdl-dev

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0" buildozer

      - name: Initialize and Configure Buildozer Spec
        run: |
          if [ ! -f buildozer.spec ]; then
            yes | buildozer init
          fi
          
          # تثبيت المتطلبات الأساسية مع توجيه إصدار Cython و pyjnius لتجنب التعارض
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy,pyjnius/' buildozer.spec || true
          sed -i 's/requirements = python3/requirements = python3,kivy,pyjnius/' buildozer.spec || true
          
          # قبول رخصة أندرويد تلقائياً
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
          sed -i 's/android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true
          
          # ضبط الإصدارات المستقرة لمنع أخطاء الترجمة
          sed -i 's/#android.api = 31/android.api = 33/' buildozer.spec || true
          sed -i 's/android.api = 30/android.api = 33/' buildozer.spec || true
          sed -i 's/#android.min_api = 21/android.min_api = 21/' buildozer.spec || true
          sed -i 's/#android.ndk = 25b/android.ndk = 25b/' buildozer.spec || true
          
          # إعداد اسم التطبيق
          sed -i 's/#title = My Application/title = Solar PR Calculator/' buildozer.spec || true
          sed -i 's/#package.name = myapp/package.name = solarpr/' buildozer.spec || true

      - name: Build with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
